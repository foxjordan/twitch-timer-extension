          - heading "What does the Sound Alerts Twitch Extension do?" [level=4] [ref=f3e118]
          - paragraph [ref=f3e120]: The Sound Alerts Twitch Extension is an interactive tool for streamers allowing your viewers to play sounds, videos, TTS, and more directly in your livestream.
        - generic [ref=f3e126]:
          - heading "How do I activate the Sound Alerts Twitch Extension?" [level=4] [ref=f3e127]
          - paragraph [ref=f3e129]:
            - text: To activate the Sound Alerts Twitch Extension on your channel, you can visit the
            - link "Streamer Dashboard" [ref=f3e130] [cursor=pointer]:
              - /url: https://dashboard.soundalerts.com
            - text: or follow our
            - link "video guide" [ref=f3e131] [cursor=pointer]:
              - /url: https://www.youtube.com/watch?v=yv9vb47vVjY
            - text: . The setup will take you less than 10 minutes.
        - generic [ref=f3e137]:
          - heading "Do my Viewers need to install anything?" [level=4] [ref=f3e138]
          - paragraph [ref=f3e140]: No, not at all. As soon as you install the Twitch Extension, your viewers can use it on desktop devices and in the official Twitch app for iOS and Android.
        - generic [ref=f3e146]:
          - heading "Can I use Sound Alerts for my other Stream Alerts?" [level=4] [ref=f3e147]
          - paragraph [ref=f3e149]:
            - text: Yes, Sound Alerts is an all-in-one solution for alerts. You can set up events like Channel Points, Subs, Follows, Hype Trains, and more in our
            - link "Streamer Dashboard" [ref=f3e150] [cursor=pointer]:
              - /url: https://dashboard.soundalerts.com
            - text: .
        - generic [ref=f3e156]:
          - heading "How do I earn money with the Twitch Extension?" [level=4] [ref=f3e157]
          - paragraph [ref=f3e159]: Twitch Partners and Affiliates can earn Bits in the Extension. When viewers perform and confirm an action requiring Bits in our Extension, streamers will earn 80% of 1 U.S. cent per Bit used.
        - generic [ref=f3e165]:
          - heading "How does the Payout work for Sound Alerts?" [level=4] [ref=f3e166]
          - paragraph [ref=f3e168]: Twitch handles the Sound Alerts revenue payout for Twitch Partners and Affiliates. It will be included in your regular Twitch payout, which usually arrives 15 days after the end of the month.
